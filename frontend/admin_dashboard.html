<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | FoundIt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/admin.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 min-h-screen font-sans text-gray-800 transition duration-300">

  <!-- Navbar -->
  <nav class="bg-purple-800 text-white px-6 py-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold tracking-wide">🛠 Admin Panel - <span class="text-yellow-300">FoundIt</span></h1>
    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition">Logout</button>
  </nav>

  <!-- Section Header -->
  <section class="max-w-6xl mx-auto py-10 px-6">
    <h2 class="text-3xl font-bold text-center text-purple-700 mb-8">Admin Controls</h2>

    <div class="grid md:grid-cols-3 gap-6 mb-10">
      <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition">
        <h3 class="font-semibold text-lg mb-2">Manage Items</h3>
        <p class="text-sm text-gray-600 mb-4">View and verify uploaded items from users.</p>
        <button onclick="loadItems()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg w-full">Manage Items</button>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition">
        <h3 class="font-semibold text-lg mb-2">Claims Panel</h3>
        <p class="text-sm text-gray-600 mb-4">Approve or reject item ownership claims.</p>
        <button onclick="loadClaims()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg w-full">View Claims</button>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition">
        <h3 class="font-semibold text-lg mb-2">Reset Database</h3>
        <p class="text-sm text-gray-600 mb-4">Danger zone: wipe the database clean.</p>
        <button onclick="alert('Reset functionality is under development.')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg w-full">Reset Now</button>
      </div>
    </div>

    <!-- Dynamic Content Area -->
    <div id="content">
      <p class="text-center text-gray-500">Select an option to get started.</p>
    </div>
  </section>

  <!-- Optional Loading Overlay -->
  <div id="loader" class="hidden fixed inset-0 flex items-center justify-center bg-white bg-opacity-70 z-50">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-purple-600"></div>
  </div>

</body>
</html>
