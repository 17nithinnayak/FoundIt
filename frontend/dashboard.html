<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | FoundIt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script defer src="dashboard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Nunito', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-purple-700 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-bold tracking-wide">📦 FoundIt</h1>
    <button onclick="logout()" class="bg-white text-purple-700 hover:bg-purple-100 font-semibold px-4 py-1.5 rounded-lg transition">
      Logout
    </button>
  </nav>

  <!-- Filter + Upload Controls -->
  <div class="flex flex-col items-center mt-8 space-y-4 px-4">
    <div class="flex gap-3 w-full max-w-2xl">
      <select id="statusFilter" class="w-1/3 px-3 py-2 rounded-lg border focus:ring-2 focus:ring-purple-400">
        <option value="">All</option>
        <option value="lost">Lost</option>
        <option value="found">Found</option>
      </select>
      <input id="searchBar" type="text" placeholder="🔍 Search items..." class="w-2/3 px-4 py-2 rounded-lg border focus:ring-2 focus:ring-purple-400" />
    </div>
    <div class="flex gap-4">
      <button onclick="openUploadForm('lost')" class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-lg shadow">
        ➕ Lost Item
      </button>
      <button onclick="openUploadForm('found')" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg shadow">
        ➕ Found Item
      </button>
    </div>
  </div>


  <div id="items-container" class="flex flex-wrap justify-center gap-6 mt-10 px-4 mb-20">

  </div>

  <div class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50" id="uploadModalOverlay">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-lg p-6">
      <h2 class="text-xl font-bold mb-4 text-purple-700" id="uploadModalLabel">📤 Add Item</h2>
      <form id="uploadForm" enctype="multipart/form-data" class="space-y-4">
        <input type="hidden" id="status" name="status" />

        <div>
          <label class="block text-sm font-medium text-gray-700">Title</label>
          <input type="text" name="title" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Description</label>
          <textarea name="description" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-400"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Location</label>
          <input type="text" name="location" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Image</label>
          <input type="file" name="image" accept="image/*" required class="w-full px-3 py-2 border rounded-lg" />
        </div>

        <div class="flex justify-end space-x-3 mt-4">
          <button type="button" onclick="closeUploadModal()" class="px-4 py-2 rounded-lg border border-gray-400 hover:bg-gray-100">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 text-white font-semibold">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      window.location.href = "login.html";
    }

    function closeUploadModal() {
      document.getElementById("uploadModalOverlay").classList.add("hidden");
    }

    function openUploadForm(type) {
      document.getElementById("status").value = type.toLowerCase();
      document.getElementById("uploadModalLabel").innerText = `📤 Add ${type} Item`;
      document.getElementById("uploadModalOverlay").classList.remove("hidden");
    }
  </script>
  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script defer src="js/dashboard.js"></script>

</body>
</html>
