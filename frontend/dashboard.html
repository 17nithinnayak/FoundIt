<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | FoundIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="dashboard.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">FoundIt Dashboard</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </nav>

    <div class="d-flex justify-content-center m-3 gap-3">
        <select id="statusFilter" class="form-select w-auto">
            <option value="">All</option>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
        </select>
        <input type="text" id="searchBar" class="form-control w-50" placeholder="Search items...">
    </div>

    <div class="d-flex justify-content-center my-4 gap-3">
        <button class="btn btn-outline-danger" onclick="openUploadForm('lost')">Add Lost Item</button>
        <button class="btn btn-outline-success" onclick="openUploadForm('found')">Add Found Item</button>
    </div>

    <!-- Upload Form Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <form id="uploadForm" enctype="multipart/form-data" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadModalLabel">Add Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="status" name="status">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" name="location" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image</label>
                        <input type="file" class="form-control" name="image" accept="image/*" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Upload</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Items Display -->
    <div id="items-container" class="d-flex flex-wrap justify-content-center"></div>

    <!-- Scripts -->
    <script>
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
