<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | FoundIt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/auth.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 flex items-center justify-center min-h-screen font-sans">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center text-purple-700">Welcome Back 👋</h2>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
        <input type="email" id="email" placeholder="Email" required
               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" id="password" placeholder="Password" required
               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <!-- Admin toggle -->
      <div class="flex items-center gap-2">
        <input type="checkbox" id="adminCheck" class="form-checkbox text-purple-600" />
        <label for="adminCheck" class="text-sm text-gray-700">Login as Admin</label>
      </div>

      <button type="submit"
              class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-xl transition">
        Login
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Don't have an account?
      <a href="register.html" class="text-purple-600 hover:underline font-medium">Register here</a>
    </p>
  </div>

</body>
</html>
