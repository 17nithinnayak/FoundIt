<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | FoundIt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/auth.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-200 flex items-center justify-center min-h-screen font-sans">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center text-purple-700">Create an Account 📝</h2>

    <form id="registerForm" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-600">Full Name</label>
        <input type="text" id="name" placeholder="Niharika M V" required
               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <div>
        <label for="regEmail" class="block text-sm font-medium text-gray-600">Email</label>
        <input type="email" id="regEmail" placeholder="niharikavengatesam@gmail.com" required
               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium text-gray-600">Phone</label>
        <input type="text" id="phone" placeholder="6360744741" required
               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <div>
        <label for="regPassword" class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" id="regPassword" placeholder="Password" required
               class="mt-1 block w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <button type="submit"
              class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-xl transition">
        Register
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Already have an account?
      <a href="login.html" class="text-purple-600 hover:underline font-medium">Login here</a>
    </p>
  </div>

</body>
</html>
